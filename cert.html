<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독도 인증 접수</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-night:#081a28;
    --sea-deep:#10293c;
    --mist:#e9eef1;
    --mist-dim:#a9bcc7;
    --ink:#0e1d27;
    --basalt:#2b343c;
    --basalt-lit:#3d4952;
    --dawn:#eaa32c;
    --dawn-deep:#b97a13;
    --o:#2f8f77;
    --x:#c05a4e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;
    background:
      radial-gradient(120% 60% at 50% 0%, #1b3d52 0%, var(--sea-deep) 45%, var(--sea-night) 100%);
    background-attachment:fixed;
    color:var(--mist);
    font-family:'IBM Plex Sans KR',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{max-width:600px;margin:0 auto;padding:34px 18px 64px;min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- masthead ---------- */
  .masthead{text-align:center;margin-bottom:26px;}
  .horizon{display:block;width:150px;height:62px;margin:0 auto 14px;}
  .event-date{font-family:'Gowun Batang',serif;font-size:14px;color:var(--dawn);letter-spacing:.06em;margin:0 0 4px;}
  .event-title{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(28px,7.5vw,38px);margin:0;line-height:1.25;}
  .event-sub{font-size:13px;color:var(--mist-dim);margin:9px 0 0;line-height:1.6;}
  .coords{font-size:11.5px;color:rgba(169,188,199,.6);margin-top:7px;font-variant-numeric:tabular-nums;}

  /* ---------- panels ---------- */
  .panel{
    background:var(--mist);color:var(--ink);border-radius:6px 6px 18px 18px;
    padding:30px 24px 26px;box-shadow:0 20px 44px rgba(0,0,0,.4);
    border-top:4px solid var(--dawn);
  }
  .panel h2{font-family:'Gowun Batang',serif;font-weight:700;font-size:21px;margin:0 0 10px;text-align:center;}
  .lead{font-size:14px;line-height:1.75;color:rgba(14,29,39,.72);text-align:center;margin:0 0 22px;}

  /* ---------- one-shot warning ---------- */
  .warning{
    border:1.5px solid var(--dawn-deep);border-radius:12px;
    background:linear-gradient(180deg,rgba(234,163,44,.16),rgba(234,163,44,.05));
    padding:17px 18px;margin-bottom:20px;
  }
  .warning h3{font-family:'Gowun Batang',serif;font-size:17px;margin:0 0 8px;color:#7d5309;}
  .warning ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.85;color:rgba(14,29,39,.85);}
  .warning ul b{color:#7d5309;}

  /* ---------- prize rules ---------- */
  .rule{display:flex;gap:13px;align-items:center;padding:13px 15px;border-radius:12px;margin-bottom:9px;}
  .rule .r-ic{font-size:25px;flex-shrink:0;width:30px;text-align:center;}
  .rule.top{background:rgba(234,163,44,.14);border:1px solid rgba(234,163,44,.45);}
  .rule .r-txt b{display:block;font-size:14px;margin-bottom:2px;}
  .rule .r-txt span{font-size:12.5px;color:rgba(14,29,39,.62);line-height:1.5;}

  /* ---------- stock ---------- */
  .stock{border:1px solid rgba(14,29,39,.14);border-radius:12px;padding:15px 16px;margin:16px 0 18px;background:rgba(255,255,255,.55);}
  .stock-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;flex-wrap:wrap;}
  .stock-img{flex:1 1 0;min-width:0;max-width:141px;height:auto;display:block;margin:0 auto;transform:translateX(-16px);
    filter:drop-shadow(0 3px 5px rgba(14,29,39,.3));}
  @media (max-width:640px){
    .stock-img{order:3;flex:0 0 100%;max-width:184px;margin:6px auto 4px;transform:none;}
  }
  .stock-label{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--o);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,143,119,.55);}70%{box-shadow:0 0 0 8px rgba(47,143,119,0);}100%{box-shadow:0 0 0 0 rgba(47,143,119,0);}}
  .stock-count{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .stock-count b{font-family:'Gowun Batang',serif;font-weight:700;font-size:28px;color:var(--dawn-deep);}
  .stock-count span{font-size:14px;color:rgba(14,29,39,.45);}
  .stock-bar{height:8px;border-radius:999px;background:rgba(14,29,39,.12);overflow:hidden;}
  .stock-bar i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#f4cd80,var(--dawn));transition:width .5s ease;}
  .stock-note{font-size:11.5px;color:rgba(14,29,39,.58);margin-top:9px;line-height:1.5;}
  .stock.sold-out .stock-count b{color:var(--x);}
  .stock.sold-out .stock-bar i{background:var(--x);}

  /* ---------- form ---------- */
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;}
  .field input{width:100%;padding:13px 14px;font-size:15px;border:1.5px solid rgba(14,29,39,.18);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;}
  .field input:focus{outline:none;border-color:var(--dawn);box-shadow:0 0 0 3px rgba(234,163,44,.25);}
  .confirm{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55;margin:16px 0 6px;cursor:pointer;}
  .confirm input{width:19px;height:19px;flex-shrink:0;margin:1px 0 0;accent-color:var(--dawn-deep);}
  .form-error{color:var(--x);font-size:13px;min-height:19px;margin:3px 0 6px;text-align:center;}

  .big-btn{width:100%;background:var(--ink);color:var(--mist);border:none;font-family:inherit;font-weight:600;font-size:16.5px;padding:15px;border-radius:999px;cursor:pointer;box-shadow:0 10px 22px rgba(14,29,39,.3);transition:transform .12s ease;}
  .big-btn:hover{transform:translateY(-2px);}
  .big-btn:active{transform:translateY(1px);}
  .big-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .fineprint{font-size:11.5px;color:rgba(14,29,39,.5);text-align:center;margin-top:13px;line-height:1.6;}

  /* ---------- quiz ---------- */
  .whoami{text-align:center;font-size:12px;color:var(--mist-dim);margin-bottom:13px;opacity:.8;}
  .progress-wrap{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(233,238,241,.2);transition:all .25s ease;}
  .dot.answered{background:var(--mist-dim);}
  .dot.current{width:11px;height:11px;background:var(--dawn);box-shadow:0 0 0 3px rgba(234,163,44,.3);}
  .score-line{text-align:center;font-size:12.5px;color:var(--mist-dim);margin-bottom:16px;font-variant-numeric:tabular-nums;}
  .score-line b{color:var(--dawn);}

  .card{
    background:var(--mist);color:var(--ink);border-radius:6px 6px 18px 18px;border-top:4px solid var(--dawn);
    padding:26px 24px 28px;flex:1;display:flex;flex-direction:column;min-height:340px;
    box-shadow:0 20px 44px rgba(0,0,0,.4);
  }
  .qnum{font-family:'Gowun Batang',serif;font-weight:700;font-size:13px;color:var(--dawn);background:var(--ink);padding:5px 13px;border-radius:999px;align-self:flex-start;margin-bottom:18px;}
  .question{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(18px,4.9vw,22px);line-height:1.7;margin:0 0 26px;flex:1;word-break:keep-all;}

  /* keycaps — the prize is a keycap keyring, so the answer keys are keys */
  .choices{display:flex;gap:20px;justify-content:center;margin-top:auto;}
  .key{
    position:relative;width:112px;height:112px;border:none;padding:0;cursor:pointer;
    border-radius:13px;background:linear-gradient(180deg,var(--basalt-lit),var(--basalt));
    box-shadow:0 7px 0 #0f161c, 0 13px 20px rgba(0,0,0,.3);
    transition:transform .09s ease, box-shadow .09s ease;
  }
  .key .cap{
    position:absolute;inset:6px 6px 10px;border-radius:9px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.18));
    display:flex;align-items:center;justify-content:center;
    font-family:'Gowun Batang',serif;font-weight:700;font-size:44px;line-height:1;
    transition:color .12s ease, background .12s ease;
  }
  .key.o .cap{color:#6fd4b6;}
  .key.x .cap{color:#f09287;}
  .key:active{transform:translateY(5px);box-shadow:0 2px 0 #0f161c, 0 5px 10px rgba(0,0,0,.3);}
  .key.pressed{transform:translateY(5px);box-shadow:0 2px 0 #0f161c, 0 5px 10px rgba(0,0,0,.3);}
  .key.o.pressed{background:linear-gradient(180deg,#3aa98d,#237a63);}
  .key.o.pressed .cap{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.12));}
  .key.x.pressed{background:linear-gradient(180deg,#d16b5e,#9e4239);}
  .key.x.pressed .cap{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.12));}
  .key:focus-visible{outline:3px solid var(--dawn);outline-offset:4px;}

  .pick-hint{text-align:center;font-size:12.5px;color:rgba(14,29,39,.55);margin-top:16px;min-height:19px;}
  .nav-row{display:flex;justify-content:center;margin-top:18px;}
  .next-btn{background:var(--dawn);color:var(--ink);border:none;font-family:inherit;font-weight:700;font-size:15px;padding:13px 34px;border-radius:999px;cursor:pointer;box-shadow:0 8px 20px rgba(234,163,44,.3);transition:transform .12s ease;opacity:0;pointer-events:none;}
  .next-btn.ready{opacity:1;pointer-events:auto;}
  .next-btn:hover{transform:translateY(-2px);}
  .next-btn:disabled{opacity:.5;}

  /* ---------- result ---------- */
  .result-panel{text-align:center;}
  .result-label{font-size:11.5px;letter-spacing:.14em;color:rgba(14,29,39,.5);margin-bottom:4px;}
  .result-score{font-family:'Gowun Batang',serif;font-weight:700;font-size:58px;margin:4px 0 0;line-height:1;}
  .result-score .denom{font-size:24px;color:rgba(14,29,39,.45);}
  .result-msg{font-size:14.5px;margin:12px 0 20px;color:rgba(14,29,39,.75);line-height:1.7;word-break:keep-all;}
  .prize-award{margin:4px 0 20px;padding:26px 20px;border-radius:14px;}
  .prize-award.keyring{background:linear-gradient(150deg,#f6d590,var(--dawn));color:#432d06;box-shadow:0 12px 28px rgba(234,163,44,.35);}
  .prize-award.none{background:rgba(14,29,39,.06);color:var(--ink);}
  .prize-award .pa-icon{font-size:44px;}
  .prize-award .pa-label{font-size:12px;font-weight:600;opacity:.75;margin-top:4px;}
  .prize-award .pa-name{font-family:'Gowun Batang',serif;font-weight:700;font-size:22px;margin:5px 0 6px;}
  .prize-award .pa-desc{font-size:13.5px;line-height:1.6;word-break:keep-all;}
  .pickup{margin-top:15px;padding:14px 15px;border-radius:10px;background:rgba(0,0,0,.1);text-align:left;}
  .pickup .pk-head{font-family:'Gowun Batang',serif;font-weight:700;font-size:15px;margin-bottom:7px;}
  .pickup .pk-head b{font-size:17px;}
  .pickup ol{margin:0;padding-left:19px;font-size:13px;line-height:1.75;}
  .pickup .pk-note{margin-top:9px;font-size:12px;opacity:.8;line-height:1.5;}
  .result-note{font-size:11.5px;color:rgba(14,29,39,.5);line-height:1.6;}
  .locked-icon{font-size:44px;margin-bottom:6px;}
  .config-warn{background:var(--x);color:#fff;border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.6;margin-bottom:16px;text-align:center;}

  /* ---------- steps ---------- */
  .steps{display:flex;justify-content:center;gap:8px;margin:0 0 20px;font-size:12px;}
  .steps .st{display:flex;align-items:center;gap:6px;color:rgba(14,29,39,.45);}
  .steps .st b{width:19px;height:19px;border-radius:50%;background:rgba(14,29,39,.13);color:rgba(14,29,39,.6);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
  .steps .st.on{color:var(--ink);font-weight:600;}
  .steps .st.on b{background:var(--dawn);color:var(--ink);}
  .steps .sep{color:rgba(14,29,39,.25);}

  /* ---------- postcard ---------- */
  .postcard{
    position:relative;border:1px solid rgba(14,29,39,.22);border-radius:8px;background:#fffdf6;
    padding:16px 16px 12px;box-shadow:0 4px 0 rgba(14,29,39,.06);
  }
  .pc-stamp{
    position:absolute;top:12px;right:14px;width:52px;height:60px;border-radius:3px;
    border:2px dashed rgba(14,29,39,.28);display:flex;align-items:center;justify-content:center;background:#fff;
  }
  .pc-stamp svg{width:40px;height:34px;}
  .pc-to{font-family:'Gowun Batang',serif;font-size:15px;margin:2px 0 3px;}
  .pc-to b{font-size:21px;font-weight:700;margin-left:6px;}
  .pc-coord{font-size:10.5px;color:rgba(14,29,39,.5);margin-bottom:12px;font-variant-numeric:tabular-nums;}
  .pc-rule{height:1px;background:repeating-linear-gradient(to right,rgba(14,29,39,.18) 0 7px,transparent 7px 13px);margin-bottom:12px;}
  .postcard textarea{
    width:100%;min-height:132px;resize:vertical;border:none;outline:none;background:transparent;
    font-family:inherit;font-size:14.5px;line-height:2.05;color:var(--ink);
    background-image:repeating-linear-gradient(transparent 0 28.7px, rgba(14,29,39,.13) 28.7px 29.7px);
  }
  .postcard textarea::placeholder{color:rgba(14,29,39,.33);}
  .pc-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;font-size:11.5px;color:rgba(14,29,39,.5);gap:10px;}
  .pc-foot .pc-count{font-variant-numeric:tabular-nums;}
  .pc-foot .pc-count.short{color:var(--x);}
  .pc-from{font-family:'Gowun Batang',serif;color:rgba(14,29,39,.7);}
  .pc-echo{
    text-align:left;background:#fffdf6;border:1px solid rgba(14,29,39,.16);border-radius:8px;
    padding:14px 15px;margin:0 0 18px;font-size:13.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
  }
  .pc-echo .pe-label{font-size:11px;letter-spacing:.1em;color:rgba(14,29,39,.45);margin-bottom:7px;font-weight:600;}
  .seal{
    display:inline-flex;align-items:center;gap:7px;background:rgba(47,143,119,.14);color:#1d6f5b;
    border:1px solid rgba(47,143,119,.4);border-radius:999px;padding:6px 15px;font-size:12.5px;font-weight:600;margin-bottom:6px;
  }

  /* ---------- teacher page (desktop only) ---------- */
  .stage.wide{max-width:min(1860px,98vw);padding-left:14px;padding-right:14px;}
  #adminScreen .desk-only{display:none;background:var(--mist);color:var(--ink);border-radius:12px;padding:22px;text-align:center;line-height:1.7;font-size:14px;}
  .adm-lock{max-width:420px;margin:60px auto 0;}
  .adm-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .adm-top h2{font-family:'Gowun Batang',serif;font-weight:700;font-size:28px;margin:0;color:var(--mist);}
  .adm-top .sub{font-size:12.5px;color:var(--mist-dim);margin-top:4px;}
  .adm-actions{display:flex;gap:8px;align-items:center;}
  .adm-btn{background:rgba(233,238,241,.12);color:var(--mist);border:1px solid rgba(233,238,241,.25);border-radius:999px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;}
  .adm-btn:hover{background:rgba(233,238,241,.2);}
  .chips{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .chip{background:var(--mist);color:var(--ink);border-radius:12px;border-top:3px solid var(--dawn);padding:12px 20px;min-width:140px;}
  .chip b{display:block;font-family:'Gowun Batang',serif;font-weight:700;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums;}
  .chip span{font-size:12px;color:rgba(14,29,39,.6);}
  .chip.green{border-top-color:var(--o);}
  .chip.red{border-top-color:var(--x);}
  .tabbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .tab{background:rgba(233,238,241,.1);color:var(--mist);border:1px solid rgba(233,238,241,.22);border-radius:999px;padding:9px 20px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  .tab small{font-weight:500;opacity:.75;margin-left:6px;}
  .tab.on{background:var(--dawn);color:var(--ink);border-color:var(--dawn);}
  .tabbar .grow{flex:1;}
  .adm-search{padding:9px 14px;border-radius:999px;border:1.5px solid rgba(233,238,241,.25);background:rgba(233,238,241,.08);color:var(--mist);font-family:inherit;font-size:14px;width:230px;}
  .adm-search::placeholder{color:rgba(233,238,241,.45);}
  .adm-search:focus{outline:none;border-color:var(--dawn);}
  .classes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start;}
  .cls{background:var(--mist);color:var(--ink);border-radius:10px;padding:10px 10px 4px;border-top:3px solid var(--dawn);}
  .cls h3{font-family:'Gowun Batang',serif;font-size:16px;margin:0 0 3px;display:flex;justify-content:space-between;align-items:baseline;}
  .cls h3 small{font-family:'IBM Plex Sans KR',sans-serif;font-size:12px;font-weight:500;color:rgba(14,29,39,.55);}
  .row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 0;border-top:1px solid rgba(14,29,39,.09);min-height:40px;}
  .row .no{font-size:12px;color:rgba(14,29,39,.45);font-variant-numeric:tabular-nums;}
  .row .nm{font-size:14px;font-weight:600;line-height:1.3;}
  .row .st{display:block;font-size:11px;font-weight:400;color:rgba(14,29,39,.5);margin-top:1px;}
  .row.ready .st{color:#7d5309;font-weight:600;}
  .row.done .st{color:#1d6f5b;}
  .row .warn{color:var(--x);font-weight:600;}
  .row .act{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .rcv{border:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer;}
  .rcv.go{background:var(--dawn);color:var(--ink);box-shadow:0 4px 10px rgba(234,163,44,.35);}
  .rcv.go:hover{transform:translateY(-1px);}
  .rcv.off{background:rgba(14,29,39,.07);color:rgba(14,29,39,.3);cursor:not-allowed;}
  .rcv.done{background:rgba(47,143,119,.16);color:#1d6f5b;cursor:default;}
  .rcv:disabled{opacity:.6;cursor:wait;}
  .undo{background:none;border:none;font-family:inherit;font-size:11.5px;color:rgba(14,29,39,.4);text-decoration:underline;cursor:pointer;padding:0;}
  .adm-empty{background:var(--mist);color:var(--ink);border-radius:12px;padding:26px;text-align:center;line-height:1.8;font-size:14px;}
  .loader{background:var(--mist);color:var(--ink);border-radius:12px;padding:22px 24px;margin-bottom:18px;}
  .loader h3{font-family:'Gowun Batang',serif;margin:0 0 6px;font-size:18px;}
  .loader p{font-size:13px;line-height:1.7;color:rgba(14,29,39,.7);margin:0 0 10px;}
  .loader textarea{width:100%;min-height:90px;border:1.5px solid rgba(14,29,39,.18);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px;}
  .loader .lrow{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .loader .adm-btn{background:var(--ink);color:var(--mist);border:none;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--mist);padding:11px 22px;border-radius:999px;font-size:13.5px;box-shadow:0 10px 26px rgba(0,0,0,.4);z-index:50;}
  @media (max-width:900px){
    #adminScreen .desk-only{display:block;}
    #adminScreen .adm-body{display:none;}
  }

  .spinner{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(233,238,241,.3);border-top-color:var(--dawn);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .hidden{display:none !important;}
  @media (max-width:400px){.key{width:96px;height:96px;}.key .cap{font-size:38px;}.choices{gap:15px;}}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>

<style>
  .kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px;}
  .kind{border:2px solid rgba(14,29,39,.18);background:#fff;border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);}
  .kind .k-ic{font-size:26px;display:block;margin-bottom:4px;}
  .kind b{display:block;font-size:15px;}
  .kind span{font-size:12px;color:rgba(14,29,39,.6);}
  .kind.on{border-color:var(--dawn-deep);background:rgba(234,163,44,.16);}
  .cnt{font-size:12.5px;color:rgba(14,29,39,.62);text-align:center;margin:-8px 0 14px;min-height:18px;}
  .drop{display:block;border:2px dashed rgba(14,29,39,.3);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:rgba(255,255,255,.55);margin-bottom:14px;font-size:14px;}
  #previews{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}
  #previews img{width:72px;height:72px;object-fit:cover;border-radius:8px;}
  .drop input{display:none;}
  .hint{font-size:12.5px;color:rgba(14,29,39,.62);line-height:1.6;margin:0 0 14px;}
  .done-rank{font-family:'Gowun Batang',serif;font-size:44px;font-weight:700;text-align:center;color:var(--dawn-deep);margin:6px 0;}
  .a-row{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid rgba(14,29,39,.1);}
  .thumbs{display:flex;flex-wrap:wrap;gap:4px;max-width:150px;flex:none;}
  .a-row img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none;background:#ddd;}
  .a-row .mid{flex:1;min-width:0;font-size:13.5px;line-height:1.5;}
  .a-row .mid small{color:rgba(14,29,39,.6);}
  .a-row .rk{font-weight:700;color:var(--dawn-deep);width:34px;text-align:center;flex:none;}
  .a-btn{border:0;border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-left:4px;}
  .a-btn.ok{background:var(--o);color:#fff;} .a-btn.no{background:var(--x);color:#fff;} .a-btn.un{background:#cfd8dc;color:var(--ink);}
  .badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;margin-left:6px;}
  .badge.approved{background:rgba(47,143,119,.2);color:#1d6a57;} .badge.rejected{background:rgba(192,90,78,.2);color:#9a3d32;} .badge.pending{background:rgba(234,163,44,.25);color:#7d5309;}
</style>

</head>
<body>
<div class="stage">
  <header class="masthead" id="mast">
    <p class="event-date">10월 19일 ~ 10월 25일</p>
    <h1 class="event-title">독도 인증 접수</h1>
    <p class="event-sub">독도 수호 러닝 · 독도 방탈출<br>인증 캡처를 올리면 선착순으로 접수돼요.</p>
  </header>

  <div id="entryScreen">
    <div class="panel">
      <h2>인증 올리기</h2>
      <div class="kinds">
        <button type="button" class="kind" data-kind="running"><span class="k-ic">🏃</span><b>독도 수호 러닝</b><span>합산 10.25km · 선착순 50명</span></button>
        <button type="button" class="kind" data-kind="escape"><span class="k-ic">🗝️</span><b>독도 방탈출</b><span>수호자 인증서 · 선착순 50명</span></button>
      </div>
      <div class="cnt" id="cnt"></div>

      <div class="field"><label for="inpNum">학번</label><input id="inpNum" type="text" inputmode="numeric" placeholder="학번을 입력하세요" autocomplete="off"></div>
      <div class="field"><label for="inpName">이름</label><input id="inpName" type="text" placeholder="이름을 입력하세요" autocomplete="off"></div>

      <label class="drop" for="inpFile"><span id="dropText">📷 캡처 사진 선택하기 (여러 장 가능, 최대 10장)</span><input id="inpFile" type="file" accept="image/*" multiple><div id="previews"></div></label>
      <p class="hint" id="kindHint">인증 종류를 먼저 골라 주세요.</p>
      <p class="hint">캡처에 위치 지도나 연락처 같은 개인정보가 보이면 가려서 올려 주세요.</p>

      <label class="confirm" for="chkRead"><input type="checkbox" id="chkRead"><span>인증 종류당 <b>한 번만</b> 올릴 수 있고, 선생님 확인 후 선물이 정해진다는 점을 확인했습니다.</span></label>
      <div class="form-error" id="formError"></div>
      <button class="big-btn" id="submitBtn">인증 제출하기</button>
    </div>
  </div>

  <div id="doneScreen" class="hidden">
    <div class="panel result-panel">
      <h2 id="doneTitle">접수 완료!</h2>
      <p class="lead" id="doneInfo"></p>
      <div class="done-rank" id="doneRank"></div>
      <p class="lead" id="doneNote">선생님이 캡처를 확인한 뒤 선물을 안내해 드려요.</p>
    </div>
  </div>

  <div id="adminScreen" class="hidden">
    <div class="panel">
      <div id="adminLock">
        <h2>교사용 비밀번호</h2>
        <div class="field"><input id="admPin" type="password" placeholder="비밀번호"></div>
        <div class="form-error" id="admPinErr"></div>
        <button class="big-btn" id="admPinBtn">열기</button>
      </div>
      <div id="adminMain" class="hidden">
        <div class="adm-top"><h2>인증 접수 현황</h2>
          <div class="adm-actions"><button class="adm-btn" id="admRefresh">새로고침</button><button class="adm-btn" id="admExit">나가기</button></div></div>
        <div class="chips" id="admChips"></div>
        <div class="tabbar" id="admTabs"></div>
        <div id="admList"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://btclpderlstknqvrvqag.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0Y2xwZGVybHN0a25xdnJ2cWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNDkyMzIsImV4cCI6MjEwNjgyNTIzMn0.ZZYLkctG2MEjMMuu8MvzPu9vq-AjbFYzMf_vVmcPOIM";
const TEACHER_NUM="0000", TEACHER_NAME="이하은";
const BUCKET="dokdo-cert", LIMIT=50;
const KIND_LABEL={running:"독도 수호 러닝", escape:"독도 방탈출"};
const KIND_HINT={
  running:"러닝 앱의 기록 화면(행사 주간 합산 10.25km 이상이 보이게)을 캡처해 올려 주세요.",
  escape:"방탈출을 마치고 이메일로 받은 '독도 수호자 인증서' 화면을 캡처해 올려 주세요."
};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let kind=null, files=[];

function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),2200);}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normNum(raw){return /^\d{4}$/.test(raw)?raw[0]+'0'+raw[1]+raw.slice(2):raw.replace(/\s+/g,'');}

/* ===== 종류 선택 + 접수 현황 ===== */
document.querySelectorAll('.kind').forEach(b=>b.addEventListener('click',()=>{
  kind=b.dataset.kind;
  document.querySelectorAll('.kind').forEach(x=>x.classList.toggle('on',x===b));
  $('kindHint').textContent=KIND_HINT[kind]; showCount();
}));
let counts={};
async function loadCounts(){
  try{const {data,error}=await sb.rpc('dokdo_cert_counts'); if(error) throw error;
    counts={}; (data||[]).forEach(r=>counts[r.kind]=r); showCount();}catch(e){}
}
function showCount(){
  const c=counts[kind]; $('cnt').textContent = kind&&c ? `현재 접수 ${c.total}명 · 선물 ${LIMIT}개` : '';
}
loadCounts(); setInterval(loadCounts,8000);

/* ===== 사진 선택 ===== */
$('inpFile').addEventListener('change',e=>{
  files=Array.from(e.target.files||[]).slice(0,10);
  if(e.target.files.length>10) toast('사진은 최대 10장까지 올릴 수 있어요.');
  $('previews').innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join('');
  $('dropText').textContent=files.length?`✅ ${files.length}장 선택됨 (눌러서 다시 고르기)`:'📷 캡처 사진 선택하기 (여러 장 가능, 최대 10장)';
});
async function compress(f){
  try{
    const bmp=await createImageBitmap(f); const s=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*s); cv.height=Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||f),'image/jpeg',0.8));
  }catch(e){return f;}
}

/* ===== 제출 ===== */
function showDone(rank,status,num,name){
  $('entryScreen').classList.add('hidden'); $('doneScreen').classList.remove('hidden');
  $('doneInfo').innerHTML=`<b>${esc(num)} ${esc(name)}</b> · ${KIND_LABEL[kind]}`;
  $('doneRank').textContent=`${rank}번째 접수`;
  $('doneNote').textContent = status==='approved' ? '확인이 끝났어요. 선물은 담임 선생님이 안내해 드려요.'
    : status==='rejected' ? '캡처를 다시 올려 주세요.' : '선생님이 캡처를 확인한 뒤 선물을 안내해 드려요.';
  window.scrollTo({top:0});
}
$('submitBtn').addEventListener('click', async ()=>{
  const rawNum=$('inpNum').value.trim(), name=$('inpName').value.trim(), err=$('formError');
  if(!rawNum||!name){err.textContent='학번과 이름을 모두 입력해 주세요.';return;}
  if(rawNum===TEACHER_NUM&&name===TEACHER_NAME){err.textContent='';openAdmin();return;}
  if(!kind){err.textContent='인증 종류를 골라 주세요.';return;}
  if(!files.length){err.textContent='인증 캡처 사진을 선택해 주세요.';return;}
  if(!$('chkRead').checked){err.textContent='안내 확인란에 체크해 주세요.';return;}
  err.textContent='';
  const num=normNum(rawNum), btn=$('submitBtn'), orig=btn.textContent;
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 올리는 중…';
  try{
    const chk=await sb.rpc('dokdo_cert_check',{p_num:num,p_name:name,p_kind:kind}); if(chk.error) throw chk.error;
    const prev=(chk.data||[])[0];
    if(prev && prev.status!=='rejected'){ showDone(prev.rank,prev.status,num,name); $('doneTitle').textContent='이미 접수했어요'; return; }
    const paths=[];
    for(const f of files){
      const blob=await compress(f);
      const path=`${kind}/${crypto.randomUUID()}.jpg`;
      const up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'}); if(up.error) throw up.error;
      paths.push(path);
    }
    const r=await sb.rpc('dokdo_cert_submit',{p_num:num,p_name:name,p_kind:kind,p_path:paths.join(',')}); if(r.error) throw r.error;
    const row=(r.data||[])[0]; showDone(row.rank,row.status,num,name); $('doneTitle').textContent='접수 완료!';
  }catch(e){ err.textContent='제출하지 못했어요. 네트워크를 확인하고 다시 시도해 주세요.'; }
  finally{ btn.disabled=false; btn.textContent=orig; }
});

/* ===== 교사용 ===== */
let pin='', subs=[], tab='running', timer=null;
function openAdmin(){
  $('entryScreen').classList.add('hidden'); $('mast').classList.add('hidden'); $('adminScreen').classList.remove('hidden');
  let s=''; try{s=sessionStorage.getItem('dokdo_cert_pin')||'';}catch(e){}
  if(s) login(s,true);
}
async function fetchList(p){const {data,error}=await sb.rpc('dokdo_cert_admin_list',{p_pin:p}); if(error) throw error; return data||[];}
async function login(p,silent){
  try{ subs=await fetchList(p); pin=p; try{sessionStorage.setItem('dokdo_cert_pin',p);}catch(e){}
    $('adminLock').classList.add('hidden'); $('adminMain').classList.remove('hidden'); renderAdmin();
    clearInterval(timer); timer=setInterval(async()=>{if(document.hidden)return; try{subs=await fetchList(pin);renderAdmin();}catch(e){}},8000);
  }catch(e){ try{sessionStorage.removeItem('dokdo_cert_pin');}catch(_){}
    if(!silent) $('admPinErr').textContent=/unauthorized/i.test(String(e.message))?'비밀번호가 맞지 않습니다.':'불러오지 못했어요. SQL 설정을 먼저 실행했는지 확인해 주세요.'; }
}
$('admPinBtn').addEventListener('click',()=>{const v=$('admPin').value; if(!v){$('admPinErr').textContent='비밀번호를 입력해 주세요.';return;} login(v,false);});
$('admPin').addEventListener('keydown',e=>{if(e.key==='Enter')$('admPinBtn').click();});
$('admExit').addEventListener('click',()=>{try{sessionStorage.removeItem('dokdo_cert_pin');}catch(e){} location.reload();});
$('admRefresh').addEventListener('click',async()=>{try{subs=await fetchList(pin);renderAdmin();toast('새로고침했어요.');}catch(e){toast('불러오지 못했어요.');}});
function fmt(iso){const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function renderAdmin(){
  const by=k=>subs.filter(s=>s.kind===k);
  $('admChips').innerHTML=['running','escape'].map(k=>{const a=by(k);const ok=a.filter(s=>s.status==='approved').length;
    return `<div class="chip green"><b>${ok} / ${LIMIT}</b><span>${KIND_LABEL[k]} 승인 (접수 ${a.filter(s=>s.status!=='rejected').length})</span></div>`;}).join('');
  $('admTabs').innerHTML=['running','escape'].map(k=>`<button class="tab ${tab===k?'on':''}" data-k="${k}">${KIND_LABEL[k]} <small>${by(k).length}</small></button>`).join('');
  $('admTabs').querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.k;renderAdmin();}));
  const list=by(tab);
  $('admList').innerHTML=list.length?list.map(s=>{
    const urls=String(s.image_path).split(',').map(p=>sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl);
    const lab={pending:'대기',approved:'승인',rejected:'반려'}[s.status];
    const btns = s.status==='pending'
      ? `<button class="a-btn ok" data-id="${s.id}" data-s="approved">승인</button><button class="a-btn no" data-id="${s.id}" data-s="rejected">반려</button>`
      : `<button class="a-btn un" data-id="${s.id}" data-s="pending">되돌리기</button>`;
    return `<div class="a-row"><div class="rk">${s.status==='rejected'?'–':s.rank}</div>
      <div class="thumbs">${urls.map(u=>`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="인증 캡처" loading="lazy"></a>`).join('')}</div>
      <div class="mid"><b>${esc(s.student_num)} ${esc(s.student_name)}</b><span class="badge ${s.status}">${lab}</span><br><small>${fmt(s.created_at)} · ${urls.length}장</small></div>${btns}</div>`;
  }).join(''):'<p class="lead" style="margin:20px 0">아직 접수가 없어요.</p>';
  $('admList').querySelectorAll('.a-btn').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;
    try{const {error}=await sb.rpc('dokdo_cert_admin_set',{p_pin:pin,p_id:Number(b.dataset.id),p_status:b.dataset.s}); if(error) throw error;
      subs=await fetchList(pin); renderAdmin();}catch(e){toast('저장하지 못했어요.'); b.disabled=false;}
  }));
}
</script>
</body>
</html>
